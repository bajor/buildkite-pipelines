# Same hosted checks as python-ml, with a Linux x86-64 lock check in place
# of the Apple Silicon gate. CI has no GPU; GPU execution stays local.
env:
  UV_CACHE_DIR: /tmp/buildkite-cache/uv
  UV_PYTHON_INSTALL_DIR: /tmp/buildkite-cache/python
  UV_LINK_MODE: copy

cache:
  name: python-ml-nvidia
  paths:
    - /tmp/buildkite-cache

steps:
  - label: ":broom: Repository hygiene"
    key: repo-hygiene
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - "__PLUGIN__":
          check: repo-hygiene

  - label: ":lock: Secrets in git history"
    key: secrets
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - "__PLUGIN__":
          check: secrets

  - label: ":python: Lint and unit tests"
    key: python
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - "__PLUGIN__":
          check: python

  - label: ":penguin: Linux NVIDIA dependency readiness"
    key: linux-nvidia
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - "__PLUGIN__":
          check: linux-nvidia

  - label: ":hammer_and_wrench: make test"
    key: make-test
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - "__PLUGIN__":
          check: make-test

  - label: ":memo: Changelog"
    key: changelog
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    plugins:
      - "__PLUGIN__":
          check: changelog
