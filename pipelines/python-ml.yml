# Shared CI for Python machine learning repositories.
# lib/upload-pipeline.sh replaces __PLUGIN__ with the uploading step's plugin
# reference before upload, so every step runs the same plugin version.
steps:
  - label: ":broom: Repository hygiene"
    key: repo-hygiene
    plugins:
      - "__PLUGIN__":
          check: repo-hygiene

  - label: ":lock: Secrets in git history"
    key: secrets
    plugins:
      - "__PLUGIN__":
          check: secrets

  - label: ":python: Lint and unit tests"
    key: python
    plugins:
      - "__PLUGIN__":
          check: python

  - label: ":apple: Apple Silicon readiness"
    key: apple-silicon
    plugins:
      - "__PLUGIN__":
          check: apple-silicon

  - label: ":hammer_and_wrench: make test"
    key: make-test
    plugins:
      - "__PLUGIN__":
          check: make-test
