name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck
      - name: Lint and test
        run: make test

  changelog:
    # Release automation reads the newest CHANGELOG.md section, so check it
    # is a valid, higher version before a merge triggers a release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CHANGELOG.md has a new releasable version
        run: checks/changelog.sh
